# Body experiment grammar (T-Reqs, CCS 2021 §5.1.3 + §5.3.3 findings).
#
# Focuses on message-body framing vectors, including the paper's novel
# non-CL/TE discoveries:
#   - chunk-size lines terminated with LF instead of CRLF (NGINX parses
#     chunked, Akamai falls back to Content-Length)
#   - chunked encoding on HTTP/1.0 (Tomcat ignores chunked on 1.0)
#   - CL/TE header combinations and odd chunk sizes

<start> ::= <request>
<request> ::= <request-line><base><entity-size-header><body>
<request-line> ::= <method-name><request-uri><http-version>
<request-uri> ::= " /_URI_ "
<http-version> ::= "HTTP/0.9" | "HTTP/1.0" | "HTTP/1.1"
<method-name> ::= "GET" | "HEAD" | "POST" | "PUT" | "DELETE" | "OPTIONS"
<base> ::= "\r\nHost: _HOST_\r\n" | "\r\nHost: _HOST_\r\nConnection: close\r\n"

<entity-size-header> ::= "" | <content-length> | <chunked-transfer-encoding> |
    <content-length><chunked-transfer-encoding> |
    <chunked-transfer-encoding><content-length>
<content-length> ::= "Content-Length: <cl>\r\n"
<chunked-transfer-encoding> ::= "Transfer-Encoding: chunked\r\n" |
    "Transfer-Encoding: chunked;ext=x\r\n" | "Transfer-Encoding:  chunked\r\n"
<cl> ::= _CL_

<body> ::= "" | <cl-body> | <chunked-body> | <lf-chunk-body> | <chunked-1-0-body>

<cl-body> ::= _VALUE_

# proper chunked encoding (CRLF line endings)
<chunked-body> ::= <chunk-line><chunked-body> | <chunk-line><last-chunk><trailer>
<chunk-line> ::= <chunk-size>\r\n<chunk-data>\r\n
<chunk-size> ::= _CHUNKSIZE_
<chunk-data> ::= _VALUE_
<last-chunk> ::= "0\r\n"
<trailer> ::= "" | "\r\n" | "X-Trailer: 1\r\n\r\n"

# paper §5.3.3: chunk-size line terminated with LF instead of CRLF
<lf-chunk-body> ::= <lf-chunk-line><lf-chunk-body> | <lf-chunk-line>"0\n"
<lf-chunk-line> ::= <chunk-size>\n<chunk-data>\n

# paper §5.3.1: chunked encoding on HTTP/1.0 — some servers ignore it
<chunked-1-0-body> ::= <chunk-line><last-chunk>
