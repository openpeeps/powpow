# All 67 standard request headers (T-Reqs, CCS 2021 — Appendix).
# Uses the paper's ::= and quoted-terminal style.

<start> ::= <request>
<request> ::= <request-line><base><entity-size-header><some-headers><body>
<request-line> ::= <method-name><request-uri><http-version>
<request-uri> ::= " /_URI_ "
<http-version> ::= "HTTP/0.9" | "HTTP/1.0" | "HTTP/1.1"
<method-name> ::= "GET" | "HEAD" | "POST" | "PUT" | "DELETE" | "CONNECT" | "OPTIONS" | "TRACE"
<base> ::= "\r\nHost: _HOST_\r\n" | "\r\nHost: _HOST_\r\nConnection: close\r\n"
<entity-size-header> ::= <content-length> | <chunked-transfer-encoding> | <content-length><chunked-transfer-encoding> | <chunked-transfer-encoding><content-length>
<content-length> ::= "Content-Length: <cl>\r\n"
<chunked-transfer-encoding> ::= "Transfer-Encoding: _TE_\r\n"
<cl> ::= _CL_
<some-headers> ::= "" | <some-header> | <some-header><some-header> | <some-header><some-header><some-header>
<some-header> ::= <accept> | <accept-charset> | <accept-encoding> | <accept-language> | <accept-ranges> | <allow> | <alpn> | <alt-used> | <authorization> | <cache-control> | <caldav-timezones> | <cdn-loop> | <content-encoding> | <content-language> | <content-length> | <content-location> | <cookie> | <date> | <depth> | <destination> | <early-data> | <expect> | <expires> | <forwarded> | <from> | <http2-settings> | <if> | <if-match> | <if-modified-since> | <if-none-match> | <if-range> | <if-schedule-tag-match> | <if-unmodified-since> | <link> | <max-forwards> | <mime-version> | <odata-isolation> | <odata-maxversion> | <odata-version> | <ordering-type> | <origin> | <oscore> | <overwrite> | <position> | <pragma> | <prefer> | <proxy-authorization> | <range> | <referer> | <schedule-reply> | <sec-token-binding> | <sec-websocket-accept> | <sec-websocket-extensions> | <sec-websocket-key> | <sec-websocket-protocol> | <sec-websocket-version> | <slug> | <te> | <timeout> | <topic> | <trailer> | <transfer-encoding> | <ttl> | <urgency> | <upgrade> | <user-agent> | <via>
<mime> ::= "text/html" | "application/json" | "application/octet-stream" | "*/*" | "image/png"
<timetag> ::= "Thu, 01 Jan 1970 00:00:00 GMT" | "\"etag\""

<accept> ::= "Accept: <mime>\r\n"
<accept-charset> ::= "Accept-Charset: utf-8\r\n"
<accept-encoding> ::= "Accept-Encoding: gzip, deflate\r\n"
<accept-language> ::= "Accept-Language: en-US,en;q=0.9\r\n"
<accept-ranges> ::= "Accept-Ranges: bytes\r\n"
<allow> ::= "Allow: GET, HEAD\r\n"
<alpn> ::= "ALPN: h2, http/1.1\r\n"
<alt-used> ::= "Alt-Used: example.com\r\n"
<authorization> ::= "Authorization: Basic dXNlcjpwYXNz\r\n"
<cache-control> ::= "Cache-Control: no-cache\r\n"
<caldav-timezones> ::= "CalDAV-Timezones: UTC\r\n"
<cdn-loop> ::= "CDN-Loop: cdn\r\n"
<content-encoding> ::= "Content-Encoding: gzip\r\n"
<content-language> ::= "Content-Language: en\r\n"
<content-length> ::= "Content-Length: <cl>\r\n"
<content-location> ::= "Content-Location: /x\r\n"
<cookie> ::= "Cookie: a=b; c=d\r\n"
<date> ::= "Date: Thu, 01 Jan 1970 00:00:00 GMT\r\n"
<depth> ::= "Depth: 1\r\n"
<destination> ::= "Destination: /dest\r\n"
<early-data> ::= "Early-Data: 1\r\n"
<expect> ::= "Expect: 100-continue\r\n"
<expires> ::= "Expires: 0\r\n"
<forwarded> ::= "Forwarded: for=1.2.3.4\r\n"
<from> ::= "From: a@example.com\r\n"
<http2-settings> ::= "HTTP2-Settings: AAEAAEAAAAIAAAA\r\n"
<if> ::= "If: <timetag>\r\n"
<if-match> ::= "If-Match: "etag"\r\n"
<if-modified-since> ::= "If-Modified-Since: Thu, 01 Jan 1970 00:00:00 GMT\r\n"
<if-none-match> ::= "If-None-Match: "etag"\r\n"
<if-range> ::= "If-Range: "etag"\r\n"
<if-schedule-tag-match> ::= "If-Schedule-Tag-Match: "st"\r\n"
<if-unmodified-since> ::= "If-Unmodified-Since: Thu, 01 Jan 1970 00:00:00 GMT\r\n"
<link> ::= "Link: </x>; rel=preload\r\n"
<max-forwards> ::= "Max-Forwards: 10\r\n"
<mime-version> ::= "MIME-Version: 1.0\r\n"
<odata-isolation> ::= "OData-Isolation: read-only\r\n"
<odata-maxversion> ::= "OData-MaxVersion: 4.0\r\n"
<odata-version> ::= "OData-Version: 4.0\r\n"
<ordering-type> ::= "Ordering-Type: Ordered\r\n"
<origin> ::= "Origin: https://example.com\r\n"
<oscore> ::= "OSCORE: 00\r\n"
<overwrite> ::= "Overwrite: T\r\n"
<position> ::= "Position: 1\r\n"
<pragma> ::= "Pragma: no-cache\r\n"
<prefer> ::= "Prefer: return=minimal\r\n"
<proxy-authorization> ::= "Proxy-Authorization: Basic dXNlcjpwYXNz\r\n"
<range> ::= "Range: bytes=0-1\r\n"
<referer> ::= "Referer: https://example.com/x\r\n"
<schedule-reply> ::= "Schedule-Reply: F\r\n"
<sec-token-binding> ::= "Sec-Token-Binding: AAAAAAA\r\n"
<sec-websocket-accept> ::= "Sec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=\r\n"
<sec-websocket-extensions> ::= "Sec-WebSocket-Extensions: permessage-deflate\r\n"
<sec-websocket-key> ::= "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
<sec-websocket-protocol> ::= "Sec-WebSocket-Protocol: chat\r\n"
<sec-websocket-version> ::= "Sec-WebSocket-Version: 13\r\n"
<slug> ::= "Slug: a-title\r\n"
<te> ::= "TE: trailers\r\n"
<timeout> ::= "Timeout: Second-3600\r\n"
<topic> ::= "Topic: /t\r\n"
<trailer> ::= "Trailer: Content-Length\r\n"
<transfer-encoding> ::= "Transfer-Encoding: <te>\r\n"
<ttl> ::= "TTL: 60\r\n"
<urgency> ::= "Urgency: high\r\n"
<upgrade> ::= "Upgrade: h2c\r\n"
<user-agent> ::= "User-Agent: Mozilla/5.0\r\n"
<via> ::= "Via: 1.1 proxy\r\n"

<body> ::= "" | _VALUE_
