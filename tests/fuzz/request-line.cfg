# Fuzz grammar for powpow's smuggler integration tests.
# Exercises request-line + CL/TE framing in both orders, chunked bodies,
# and whitespace/case variants — the request-smuggling surface.

<start> = <request>

<request> = <request-line><headers><body>
<request-line> = <method> <ws> <uri> <ws> HTTP/<version> <crlf>
<method> = GET | HEAD | POST | PUT | DELETE | OPTIONS
<ws> = _WS_
<uri> = /_PATH_
<version> = 1.0 | 1.1
<crlf> = \r\n

<headers> = <base><framing-headers><extra-headers>
<base> = "Host: <host>\r\n" | "Host: <host>\r\nConnection: close\r\n"
<host> = _HOST_
<framing-headers> = "" | <cl-header> | <te-header> | <cl-header><te-header> | <te-header><cl-header>
<cl-header> = "Content-Length: <cl>\r\n"
<te-header> = "Transfer-Encoding: <te>\r\n"
<cl> = _CL_
<te> = _TE_
<extra-headers> = "" | <extra-line> | <extra-line><extra-line>
<extra-line> = "X-Custom: <value>\r\n" | "Connection: <connection>\r\n"
<connection> = _CONNECTION_

<body> = "" | <cl-body> | <chunked-body> | <lf-chunk-body>
<cl-body> = _VALUE_
<chunked-body> = <chunk-line><chunked-body> | <chunk-line>"0\r\n"
<chunk-line> = <chunk-size>\r\n<chunk-data>\r\n
<chunk-size> = _CHUNKSIZE_
<chunk-data> = _VALUE_
<lf-chunk-body> = <chunk-size>\n<chunk-data>\n"0\n"
