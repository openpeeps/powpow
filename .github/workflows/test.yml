name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test.yml@main
    with:
      cache: false
      nim-version: stable
      # Windows-only iterations on the test/windows-only branch; full matrix
      # everywhere else (pushes to the branch *and* PRs from it run here —
      # ref_name is the branch on push, "N/merge" on pull_request).
      os: "${{ github.ref_name == 'test/windows-only' && '[{"os":"windows-latest"}]' || '[{"os":"ubuntu-latest"},{"os":"ubuntu-24.04-arm"},{"os":"windows-latest"},{"os":"windows-11-arm"},{"os":"macos-15"}]' }}"
      pre-test-command: 'if [ "$RUNNER_OS" = "Linux" ]; then sudo modprobe tls; fi'
